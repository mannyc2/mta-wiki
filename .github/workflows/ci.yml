name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pins are immutable reviewed commits: checkout v4.2.2 and setup-bun v2.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
